<title>Yaadein Companion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: a calm phone-first patient app inside a research console; staff views open as wide responsive panels. */
/* Palette: Deep Forest Green branding, Mint active states, Sage accents, Off-White ground, Warm Beige botanicals, Pastel Blue wellness cards. */
:root{
  --forest:#15473F; --mint:#50BDA9; --sage:#A5C99C; --offwhite:#F6FAF8; --beige:#D8CCBC; --pblue:#8ECDE1; --on-light:#12352F;
  --bg:#F6FAF8; --surface:#FFFFFF; --surface-2:#E8F1ED; --ink:#12302B; --muted:#587069; --line:#D3E3DC;
  --accent:#15473F; --accent-ink:#FFFFFF; --accent-soft:#DDF2EC;
  --warm:#15473F; --warm-soft:#DDF2EC; --ok:#1F7A69; --ok-soft:#DDF2EC; --alert:#C2413A; --alert-soft:#F8E1DE; --info:#2A7890; --info-soft:#E1F2F8;
  --phone:#FBFDFC; --shadow:0 18px 50px -22px rgba(21,71,63,.35);
  --f-ui:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Urdu Typesetting","Noto Naskh Arabic",serif;
  --r:18px;
  --pink:#50BDA9; --orange:#A5C99C; --sun:#D8CCBC; --teal:#50BDA9; --sky:#8ECDE1; --violet:#50BDA9;
  --blob1:rgba(80,189,169,.13); --blob2:rgba(142,205,225,.14); --blob3:rgba(216,204,188,.22);
  --sunset:linear-gradient(125deg,#15473F 0%,#1F6A5C 100%);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1B18; --surface:#142623; --surface-2:#1B322E; --ink:#E5F2EE; --muted:#9BB7AF; --line:#25413B;
  --accent:#50BDA9; --accent-ink:#0D1B18; --accent-soft:#183A34;
  --warm:#50BDA9; --warm-soft:#183A34; --ok:#50BDA9; --ok-soft:#183A34; --alert:#F07E76; --alert-soft:#42231F; --info:#8ECDE1; --info-soft:#15313A;
  --phone:#112220; --shadow:0 18px 50px -22px rgba(0,0,0,.7); --blob1:rgba(80,189,169,.10); --blob2:rgba(142,205,225,.07); --blob3:rgba(216,204,188,.05); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1B18; --surface:#142623; --surface-2:#1B322E; --ink:#E5F2EE; --muted:#9BB7AF; --line:#25413B;
  --accent:#50BDA9; --accent-ink:#0D1B18; --accent-soft:#183A34;
  --warm:#50BDA9; --warm-soft:#183A34; --ok:#50BDA9; --ok-soft:#183A34; --alert:#F07E76; --alert-soft:#42231F; --info:#8ECDE1; --info-soft:#15313A;
  --phone:#112220; --shadow:0 18px 50px -22px rgba(0,0,0,.7); --blob1:rgba(80,189,169,.10); --blob2:rgba(142,205,225,.07); --blob3:rgba(216,204,188,.05); color-scheme:dark}
*{box-sizing:border-box}
body{background:radial-gradient(900px 500px at 92% -5%,var(--blob1),transparent 70%),radial-gradient(800px 500px at -5% 30%,var(--blob2),transparent 70%),radial-gradient(700px 400px at 60% 105%,var(--blob3),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
.ur{font-family:var(--f-ur);line-height:2.05}
[dir="rtl"] .num, .num{font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;max-width:1180px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brand b{font-weight:600;font-size:17px;letter-spacing:.01em}
.brand .ur{font-size:15px;color:var(--muted);line-height:1.6}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warm-soft);color:var(--warm)}
.chip.bad{background:var(--alert-soft);color:var(--alert)}
.chip.info{background:var(--info-soft);color:var(--info)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:12px;font-weight:500;font-size:14px;transition:transform .12s,background .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--alert);border-color:color-mix(in srgb,var(--alert) 40%,var(--line))}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:14px}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
input[type=text],input[type=time],input[type=number],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 11px;font-size:14.5px}
textarea{resize:vertical;min-height:70px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.tablewrap{overflow-x:auto}

/* ===== PATIENT PHONE ===== */
.patient-stage{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px;align-items:start;justify-content:center}
@media (max-width:860px){.patient-stage{grid-template-columns:minmax(0,1fr)}.side-notes{order:2}}
.phone{background:var(--phone);border:1px solid var(--line);border-radius:34px;box-shadow:var(--shadow);overflow:hidden;position:relative;display:flex;flex-direction:column;height:min(820px,calc(100vh - 110px));min-height:600px;max-width:420px;width:100%;margin:0 auto}
@media (max-width:480px){.phone{border-radius:22px;height:calc(100vh - 120px)}}
.p-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px;gap:8px}
.p-lang{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.p-body{flex:1;overflow-y:auto;padding:6px 18px 18px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth;min-height:0}
.p-body > *{flex-shrink:0}
.p-nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.p-nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:14px;color:var(--muted);font-size:12px;min-height:62px;transition:background .2s,color .2s}
.p-nav button svg{width:26px;height:26px}
.p-nav button[aria-current="true"]{color:var(--on-light);background:var(--mint)}
.p-nav .ur{font-size:12px}
.p-nav .ur{font-size:13px;line-height:1.7}
.hello{font-size:26px;font-weight:600}
.hello.ur{font-size:26px;font-weight:700;line-height:1.9}
.orient{background:var(--sunset);color:#fff;border-radius:24px;padding:18px 20px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.orient .big{font-size:30px;font-weight:600;line-height:1.1}
.orient .ur.big{font-size:26px;line-height:1.8}
.orient .sky{position:absolute;inset-inline-end:-24px;top:-28px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55) 0%,rgba(255,255,255,.15) 50%,transparent 70%)}
.orient small{opacity:.85;font-size:14px}
.memcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.memcard .ph{aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;position:relative}
.memcard .ph img{width:100%;height:100%;object-fit:cover}
.memcard .in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.memcard h3{font-size:19px;font-weight:600}
.memcard h3.ur{font-size:19px;line-height:1.9}
.memcard p{margin:0;font-size:16px}
.memcard p.ur{font-size:16px;line-height:2.2}
.bigbtn{border:0;border-radius:16px;padding:13px 16px;font-size:16px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px}
.bigbtn.pri{background:var(--sunset);color:#fff}
.bigbtn.soft{background:var(--accent-soft);color:var(--accent)}
.bigbtn.ok{background:var(--mint);color:var(--on-light)}
.bigbtn.plain{background:var(--surface-2);color:var(--ink)}
.bigbtn svg{width:22px;height:22px}
.bigbtn .ur{line-height:1.6}
.todo{display:flex;flex-direction:column;gap:8px}
.todo-item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.todo-item .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.todo-item .ic svg{width:22px;height:22px}
.todo-item .t{flex:1;min-width:0}
.todo-item .t b{font-weight:500;display:block}
.todo-item.done{opacity:.6}
.todo-item.done b{text-decoration:line-through}
.ic.med{background:var(--sage);color:var(--on-light)}
.ic.routine{background:var(--pblue);color:var(--on-light)}
.ic.memory{background:var(--mint);color:var(--on-light)}
.ic.done{background:var(--forest)!important;color:#fff!important}
.ic.done{background:var(--ok-soft);color:var(--ok)}
.sec-title{font-size:15px;font-weight:600;color:var(--muted);margin-top:4px}
.sec-title.ur{font-size:15px}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;flex:1}
.bubble{max-width:86%;padding:10px 14px;border-radius:20px;font-size:16px;white-space:pre-wrap;word-wrap:break-word}
.bubble.ur{font-size:16.5px;line-height:2.1}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-end-end-radius:6px}
.bubble.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-end-start-radius:6px}
.bubble.sys{align-self:center;background:var(--surface-2);color:var(--muted);font-size:13px;border-radius:12px;max-width:95%;text-align:center}
.bubble.safe{background:var(--warm-soft);border-color:color-mix(in srgb,var(--warm) 35%,var(--line))}
.bmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-family:var(--f-ui)}
.bmeta .chip{font-size:11.5px;padding:2px 8px;line-height:1.6}
.bmeta button.chip{border:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;white-space:nowrap}
.chips button.ur{font-family:var(--f-ur);line-height:1.8;font-size:14px}
.composer{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface)}
.composer input{flex:1;min-width:0;border-radius:999px;padding:12px 16px;font-size:16px}
.mic{width:60px;height:60px;border-radius:50%;border:0;background:var(--sunset);color:#fff;display:grid;place-items:center;flex:none;position:relative}
.mic svg{width:28px;height:28px}
.mic.live::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--accent);animation:pulse 1.4s infinite}
@keyframes pulse{0%{opacity:.9;transform:scale(.95)}100%{opacity:0;transform:scale(1.25)}}
.send{width:46px;height:46px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;flex:none}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.talk-hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:6px 0 4px}
.orb{width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff8 0 14%,transparent 30%),radial-gradient(circle at 70% 75%,#15473F,#2C7A6B 45%,#50BDA9 100%);box-shadow:0 14px 34px -12px #15473F}
.orb.speaking{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.07)}}

/* story */
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.cats button{flex:none;border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:14px}
.cats button.ur{font-family:var(--f-ur);line-height:1.8}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.book{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.page{border:1px solid var(--line);background:var(--surface);border-radius:18px;overflow:hidden;text-align:start;padding:0;display:flex;flex-direction:column}
.page .ph{aspect-ratio:4/3;max-width:100%;display:grid;place-items:center}
.page .ph img{width:100%;height:100%;object-fit:cover}
.page .cap{padding:8px 10px 10px;font-size:14px;font-weight:500}
.page .cap.ur{line-height:1.9}

/* placeholder art */
.art{width:100%;height:100%;display:grid;place-items:center;position:relative;overflow:hidden}
.art svg{width:42%;height:auto;opacity:.9}
.art.family{background:linear-gradient(135deg,#DDF2EC,#50BDA9);color:#15473F}
.art.places{background:linear-gradient(135deg,#EAF3E6,#A5C99C);color:#15473F}
.art.life{background:linear-gradient(135deg,#F3EEE6,#D8CCBC);color:#15473F}
.art.likes{background:linear-gradient(135deg,#E5F4F9,#8ECDE1);color:#15473F}
.art.routine{background:linear-gradient(135deg,#E8F1ED,#A5C99C);color:#15473F}

/* mood */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood{border:2px solid transparent;background:var(--surface);border-radius:18px;padding:10px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.mood .ur{font-size:13px;line-height:1.8}
.mood svg{width:46px;height:46px}
.mood[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.week{display:flex;gap:6px;justify-content:space-between}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.week span.m{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.week span.m svg{width:26px;height:26px}

/* reminder overlays inside phone */
.gentle{position:absolute;inset-inline:12px;top:12px;z-index:5;background:var(--surface);border:1px solid color-mix(in srgb,var(--warm) 45%,var(--line));border-radius:22px;padding:14px 16px;box-shadow:0 16px 40px -18px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:10px;animation:drop .6s cubic-bezier(.2,.8,.2,1)}
.gentle .glow{position:absolute;inset:0;border-radius:22px;background:linear-gradient(120deg,var(--warm-soft),transparent 60%);z-index:-1}
.gentle h3{font-size:17px;font-weight:600}
.gentle h3.ur{line-height:1.9}
@keyframes drop{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
.harsh{position:absolute;inset:0;z-index:6;background:rgba(190,59,52,.96);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;padding:24px;text-align:center}
.harsh h2{font-size:30px;font-weight:700;letter-spacing:.02em}
.harsh h2.ur{line-height:1.9}
.harsh .bigbtn{background:#fff;color:#BE3B34;min-width:200px;font-weight:700}
.harsh .bigbtn.out{background:transparent;color:#fff;border:2px solid #fff}
.harsh .flash{animation:flash 1s steps(2) infinite}
@keyframes flash{50%{opacity:.4}}

/* side notes */
.side-notes{display:flex;flex-direction:column;gap:14px;min-width:0}
.pipeline{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:8px 0;position:relative}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.step.on .n{background:var(--accent);color:var(--accent-ink)}
.step.ok .n{background:var(--ok);color:var(--accent-ink)}
.step.warn .n{background:var(--warm);color:var(--accent-ink)}
.step b{font-weight:500;font-size:14px}
.step p{margin:0;font-size:12.5px;color:var(--muted)}
.trace{font-size:12.5px;background:var(--surface-2);border-radius:10px;padding:8px 10px;max-height:160px;overflow:auto;white-space:pre-wrap;word-break:break-word}

/* staff views */
.view-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin:8px 0 16px}
.view-head h1{font-size:26px;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tabs .count{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--alert);color:#fff;font-size:11px;margin-inline-start:4px}
.mem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.mem .ph{aspect-ratio:16/9;max-width:100%}
.mem .ph img{width:100%;height:100%;object-fit:cover;display:block}
.mem .in{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.mem .in b{font-weight:600}
.mem .in p{margin:0;font-size:13.5px;color:var(--muted)}
.mem .ft{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .v{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .s{font-size:12.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}

const T = s => { if(L()!=='ur' || s==null) return s; const str=String(s), k=str.trim(); if(!k) return str; if(UR[k]!=null) return str.replace(k,UR[k]); for(const [rx,rep] of URX){ if(rx.test(k)) return str.replace(k,k.replace(rx,rep)); } return str; };
function i18n(root){
  if(!root) return; const ur=L()==='ur';
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('script,style,textarea,.phone,.no-i18n')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[]; let n; while(n=w.nextNode()) nodes.push(n);
  nodes.forEach(n=>{ if(n.__en==null){ if(!/[A-Za-z]/.test(n.nodeValue)) return; n.__en=n.nodeValue; } const v=ur?T(n.__en):n.__en; if(v!==n.nodeValue) n.nodeValue=v; });
  root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(e=>{ if(e.closest('.phone,.no-i18n')) return; ['placeholder','aria-label','title'].forEach(a=>{ const key='en'+a.replace(/-./g,m=>m[1].toUpperCase()); let orig=e.dataset[key]; const v=e.getAttribute(a); if(orig==null){ if(!v||!/[A-Za-z]/.test(v)) return; orig=v; e.dataset[key]=v; } const t=ur?T(orig):orig; if(t!==v) e.setAttribute(a,t); }); });
  root.querySelectorAll('option').forEach(o=>{ if(o.dataset.en==null){ if(!/[A-Za-z]/.test(o.textContent)) return; o.dataset.en=o.textContent; } const t=ur?T(o.dataset.en):o.dataset.en; if(t!==o.textContent) o.textContent=t; });
}
function applyLangAttrs(){ const ur=L()==='ur'; document.documentElement.lang=ur?'ur':'en'; document.documentElement.dir=ur?'rtl':'ltr'; }

/* ============ DATA LAYER: shared db, or in-memory demo ============ */
const COLS=['facts','reminders','events','alerts','study'];
async function boot(){
  render();
  if(!lsGet('uilang','')) langPicker();
  if(window.claude && window.claude.use){
    try{ DB = await window.claude.use('db'); }catch(e){ DB=null; }
    try{ ASSETS = await window.claude.use('assets'); }catch(e){}
    try{ SAMPLE = await window.claude.use('sample'); }catch(e){}
    try{ DOWNLOADS = await window.claude.use('downloads'); }catch(e){}
  }
  if(DB){
    S.mode='db';
    let first={}; COLS.forEach(c=>first[c]=false);
    const sub = (q,col) => q.onSnapshot(snap=>{ S[col]=snap.docs.map(d=>({id:d.id,...d.data()})); first[col]=true; changed(); }, e=>{ toast('Could not load '+col+': '+e.code); });
    sub(DB.collection('facts'),'facts');
    sub(DB.collection('reminders'),'reminders');
    sub(DB.collection('events').orderBy('ts','desc').limit(800),'events');
    sub(DB.collection('alerts').orderBy('ts','desc').limit(200),'alerts');
    sub(DB.collection('study').orderBy('ts','desc').limit(300),'study');
    DB.doc('settings/main').onSnapshot(s=>{ S.settings={...DEFAULT_SETTINGS,...(s.exists?s.data():{})}; S.ready=true; changed(); }, e=>{ S.ready=true; changed(); });
  } else {
    S.mode='local'; S.ready=true; loadPersonaLocal(PERSONAS[0]); seedLocalHistory(); changed();
  }
  setInterval(tick, 15000);
}
function loadPersonaLocal(p){
  S.settings={...DEFAULT_SETTINGS,...p.settings,persona:p.key};
  S.facts=p.facts.map((f,i)=>personaFact(f,i)); S.reminders=p.reminders.map(personaRem);
}
function personaFact(f,i){ return {id:uid(),category:f[0],title:f[1],titleUr:f[2],text:f[3],textUr:f[4],people:f[5]?[f[5]]:[],tags:f[6]||'',approved:true,studyGroup:i%2?'control':'reminded',photoId:'',audioId:'',fictional:true,createdAt:Date.now()-i*1000}; }
function personaRem(r){ return {id:uid(),type:r[0],label:r[1],labelUr:r[2],time:r[3],enabled:true}; }
function seedLocalHistory(){ // a believable fortnight so the clinician view has something to show in demo mode; marked as examples
  const base=Date.now(); const moods=['okay','happy','okay','tired','okay','worried','okay','happy','happy','okay','tired','okay','happy','okay'];
  moods.forEach((m,i)=>S.events.push({id:uid(),kind:'mood',mood:m,ts:base-(13-i)*864e5-3*36e5,example:true}));
  for(let i=1;i<14;i++){ S.reminders.forEach((r,j)=>{ if(r.type==='memory' && j%2) return; const ok=(i+j)%5!==0; S.events.push({id:uid(),kind:ok?'reminder_done':'reminder_later',reminderId:r.id,rtype:r.type,style:i<7?'conventional':'gentle',day:dayKey(base-i*864e5),respSec:ok?(i<7?18+j*3:35+j*4):0,ts:base-i*864e5+toMin(r.time)*6e4-12*36e5,example:true}); }); }
  S.events.sort((a,b)=>b.ts-a.ts);
  S.alerts.push({id:uid(),level:'watch',reason:'Said they felt watched',excerpt:'"someone is watching me from the window"',ts:base-2*864e5,resolved:false,example:true});
}
async function addDoc(col,data){
  if(S.mode==='db'){ try{ const r=await DB.collection(col).add(data); return r.id; }catch(e){ toast(saveErr(e)); throw e; } }
  const id=uid(); S[col].unshift({id,...data}); changed(); return id;
}
async function updDoc(col,id,patch){
  if(S.mode==='db'){ try{ await DB.collection(col).doc(id).update(patch); }catch(e){ toast(saveErr(e)); throw e; } return; }
  const d=S[col].find(x=>x.id===id); if(d) Object.assign(d,patch); changed();
}
async function delDoc(col,id){
  if(S.mode==='db'){ try{ await DB.collection(col).doc(id).delete(); }catch(e){ toast(saveErr(e)); throw e; } return; }
  S[col]=S[col].filter(x=>x.id!==id); changed();
}
async function saveSettings(patch){
  const next={...S.settings,...patch};
  if(S.mode==='db'){ try{ await DB.doc('settings/main').set(next); }catch(e){ toast(saveErr(e)); throw e; } }
  else { S.settings=next; changed(); }
}
function saveErr(e){ return e && e.code==='not_granted' ? 'You can view this app but not change it. Ask the owner for edit access.' : 'Could not save ('+(e&&e.code||'error')+'). Try again.'; }
const logEvent = data => addDoc('events',{...data,ts:now().getTime(),participant:S.settings.participant||''}).catch(()=>{});

let renderQueued=false;
function changed(){ if(renderQueued) return; renderQueued=true; requestAnimationFrame(()=>{ renderQueued=false; const a=document.activeElement; if(a && a.closest && a.closest('#app') && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.dataset.keep!=='no'){ pendingRender=true; return; } render(); }); }
let pendingRender=false;
document.addEventListener('focusout',()=>{ if(pendingRender){ setTimeout(()=>{ const a=document.activeElement; if(!(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))){ pendingRender=false; render(); } },50); } });

/* ============ REMINDER SCHEDULER ============ */
function inQuiet(n){ const m=n.getHours()*60+n.getMinutes(), a=toMin(S.settings.quietStart), b=toMin(S.settings.quietEnd); return a>b ? (m>=a||m<b) : (m>=a&&m<b); }
function recentLowMood(){ const t=now().getTime(); return S.events.some(e=>e.kind==='mood'&&(e.mood==='worried'||e.mood==='sad')&&t-e.ts<2*36e5); }
function dueReminders(){
  const n=now(), m=n.getHours()*60+n.getMinutes(), day=dayKey(n), gentle=S.settings.reminderStyle==='gentle';
  const memShown=S.events.filter(e=>e.day===day&&e.rtype==='memory'&&(e.kind==='reminder_done'||e.kind==='reminder_later'||e.kind==='reminder_skip')).length;
  return S.reminders.filter(r=>{
    if(!r.enabled) return false; const t=toMin(r.time); if(m<t || m>t+180) return false;
    if(remState(r,day)==='done') return false;
    const later=S.events.find(e=>e.reminderId===r.id&&e.day===day&&e.kind==='reminder_later'); if(later && n.getTime()-later.ts < (gentle?30:10)*60000) return false;
    if(S.shownToday[r.id+day] && S.active && S.active.r.id===r.id) return false;
    if(gentle && r.type==='memory'){ if(inQuiet(n)) return false; if(memShown>=+S.settings.maxMemoryPerDay) return false; if(recentLowMood()) return false; }
    return true;
  }).sort((a,b)=>toMin(a.time)-toMin(b.time));
}
let lastMin='';
function tick(){
  if(!S.ready) return;
  if(!S.active){ const due=dueReminders(); if(due.length){ showReminder(due[0]); return; } }
  const m=hm(now()); if(m!==lastMin){ lastMin=m; const playing=[...document.querySelectorAll('audio')].some(a=>!a.paused); if(S.role==='patient' && !playing) changed(); }
}
function pickMemoryFact(){ const pool=remindedFacts(); if(!pool.length) return null; const day=dayKey(now()); const used=S.events.filter(e=>e.day===day&&e.factId).map(e=>e.factId); return pool.find(f=>!used.includes(f.id)) || pool[Math.floor(Math.random()*pool.length)]; }
function showReminder(r){
  const fact = r.type==='memory' ? pickMemoryFact() : null;
  S.active={r,fact,shownAt:Date.now()}; S.shownToday[r.id+dayKey(now())]=1;
  if(S.settings.reminderStyle!=='gentle') beep();
  if(S.role==='patient') render();
  else toast('A reminder is showing in the Patient view');
}
function reminderOverlay(){
  const a=S.active; if(!a) return '';
  const r=a.r, label=L()==='ur'?(r.labelUr||r.label):r.label, f=a.fact;

    else { title=tr('If you feel like it','اگر دل چاہے تو'); line=tr(`It is a nice time for: ${label}.`,`${label} کا اچھا وقت ہے۔`); }
    return `<div class="gentle" role="status"><div class="glow"></div>

  }
  return `<div class="harsh" role="alertdialog" aria-label="Reminder">
    <div class="flash">${ic('bell',64)}</div>
    <div class="${urc()}" style="font-size:15px;letter-spacing:.12em;font-weight:600">${tr('REMINDER','یاد دہانی')} · <span class="num" style="direction:ltr;unicode-bidi:isolate">${esc(r.time)}</span></div>

const STOP = new Set('the a an is are was my me i you your of to in on and or what who when where how tell about do did does it this that please more some any kya hai mera meri mere ko ka ki ke se aur kaun mujhe batao bataen hain کیا ہے ہیں میں کے کی کا اور کو سے میرے میری میرا بارے بتاؤ بتائیں مجھے کون مزید تم آپ'.split(' '));
const SYN = [
  [/(family|ghar wal|گھر وال|خاندان|relatives|rishtedar|رشتہ دار)/i,'family'],
  [/(childhood|child|young|bachpan|بچپن|grew up|born|پیدا)/i,'childhood'],
  [/(like|love|favourite|favorite|pasand|پسند|enjoy)/i,'likes'],
  [/(place|where|jagah|جگہ|go to|visit)/i,'places'],
  [/(work|job|kaam|کام|naukri|نوکری)/i,'work'],
  [/(food|eat|khana|کھانا|breakfast|ناشتہ)/i,'food']
];
const toks = s => (String(s).toLowerCase().match(/[\p{L}\p{N}]+/gu)||[]).filter(w=>w.length>1 && !STOP.has(w));
function retrieve(q,k=4){
  const qt=toks(q); const cats=SYN.filter(([rx])=>rx.test(q)).map(x=>x[1]);
  const scored=S.facts.filter(f=>f.approved && f.kind!=='imagined').map(f=>{
    const title=toks((f.title||'')+' '+(f.titleUr||'')), body=toks((f.text||'')+' '+(f.textUr||'')), tags=toks(f.tags||''), ppl=toks((f.people||[]).join(' '));
    let s=0; qt.forEach(w=>{ if(title.includes(w)) s+=3; if(ppl.includes(w)) s+=3; if(tags.includes(w)) s+=2; if(body.includes(w)) s+=1; });
    cats.forEach(c=>{ if(f.category===c) s+=3; if(tags.includes(c)) s+=2; if(c==='childhood' && /(childhood|bachpan|بچپن)/.test(f.tags||'')) s+=4; if(c==='likes'&&f.category==='likes') s+=1; if((c==='work'||c==='food') && (f.tags||'').includes(c)) s+=3; });
    return {f,s};
  }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,k);

}

    const parts=meds.map(r=>{ const ev=S.events.find(e=>e.reminderId===r.id&&e.day===day&&e.kind==='reminder_done'); const nm=lang==='ur'?(r.labelUr||r.label):r.label; return ev? say(lang,`${nm} (${r.time}): marked done at ${hm(new Date(ev.ts))}.`,`${nm} (${r.time}): ${hm(new Date(ev.ts))} پر ہو گیا لکھا گیا۔`) : say(lang,`${nm} (${r.time}): not marked yet.`,`${nm} (${r.time}): ابھی نہیں لکھا گیا۔`); });

let VOICES=[]; try{ speechSynthesis.onvoiceschanged=()=>VOICES=speechSynthesis.getVoices(); VOICES=speechSynthesis.getVoices(); }catch(e){}
function pickVoice(isUr){
  let vs=VOICES; try{ if(!vs.length) vs=VOICES=speechSynthesis.getVoices(); }catch(e){}
  if(isUr) return vs.find(v=>/^ur/i.test(v.lang)&&/natural|online|neural/i.test(v.name)) || vs.find(v=>/^ur/i.test(v.lang)) || null;
  return vs.find(v=>/^en-(GB|IN)/i.test(v.lang)&&/natural|online|google/i.test(v.name)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
function speak(text,force){
  if(!force && !S.settings.voice) return;
  if(!('speechSynthesis' in window)){ voiceHelp(false); return; }
  const isUr=/[؀-ۿ]/.test(text); const v=pickVoice(isUr);
  if(isUr && !v){ voiceHelp(true); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  setTimeout(()=>{ try{
    const u=new SpeechSynthesisUtterance(text.replace(/\n/g,'. '));
    if(v){ u.voice=v; u.lang=v.lang; } else u.lang=isUr?'ur-PK':'en-GB';
    u.rate=.9; u.pitch=1; u.volume=1;
    u.onstart=()=>{S.speaking=true; document.querySelector('.orb')?.classList.add('speaking')};
    u.onend=u.onerror=()=>{S.speaking=false; document.querySelector('.orb')?.classList.remove('speaking')};
    speechSynthesis.speak(u); speechSynthesis.resume();
  }catch(e){ voiceHelp(false); } },80);
}

function moodChart(){
  const W=520,H=190,P={l:30,r:12,t:12,b:26}; const t0=now().getTime()-13*864e5;
  const pts=[...Array(14)].map((_,i)=>{ const k=dayKey(t0+i*864e5); const ev=S.events.filter(e=>e.kind==='mood'&&dayKey(e.ts)===k); const v=ev.length? ev.reduce((s,e)=>s+(MOODS.find(m=>m.k===e.mood)?.score||3),0)/ev.length : null; return {i,k,v}; });
  const x=i=>P.l+i*(W-P.l-P.r)/13, y=v=>P.t+(5-v)*(H-P.t-P.b)/4;
  const valid=pts.filter(p=>p.v!=null); const path=valid.map((p,j)=>(j?'L':'M')+x(p.i).toFixed(1)+','+y(p.v).toFixed(1)).join('');
  const area= valid.length>1? path+`L${x(valid[valid.length-1].i)},${H-P.b}L${x(valid[0].i)},${H-P.b}Z`:'';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mood over 14 days">
   ${[1,2,3,4,5].map(v=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="${v===3?'':'3 4'}"/><text x="${P.l-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('')}
   ${area?`<path d="${area}" fill="var(--accent)" fill-opacity=".12"/>`:''}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>
   ${valid.map((p,j)=>`<circle cx="${x(p.i)}" cy="${y(p.v)}" r="${j===valid.length-1?5:3.2}" fill="${p.v<=2?'var(--warm)':'var(--accent)'}" stroke="var(--surface)" stroke-width="1.5"><title>${p.k}: ${p.v.toFixed(1)}</title></circle>`).join('')}
   ${pts.filter((_,i)=>i%3===0||i===13).map(p=>`<text x="${x(p.i)}" y="${H-8}" text-anchor="middle">${p.k.slice(8)}/${p.k.slice(5,7)}</text>`).join('')}
   ${!valid.length?`<text x="${W/2}" y="${H/2}" text-anchor="middle">No check-ins yet</text>`:''}</svg>
   <div class="legend"><span>5 happy · 4 okay · 3 tired · 2 worried · 1 sad</span></div>`;
}
function popChart(){
  const W=520,H=200,P={l:44,r:12,t:12,b:26}, lo=0.252, hi=0.263, n=28;
  const x=i=>P.l+i*(W-P.l-P.r)/(n-1), y=v=>P.t+(hi-v)*(H-P.t-P.b)/(hi-lo);
  const line=(arr,col,w)=>`<path d="${arr.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)).join('')}" fill="none" stroke="${col}" stroke-width="${w}"/>`;
  const ticks=[0.252,0.255,0.258,0.261];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Prevalence lines">${ticks.map(v=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${P.l-6}" y="${y(v)+4}" text-anchor="end">${v.toFixed(3)}</text>`).join('')}
   ${line(POP.W,'var(--muted)',1.6)}${line(POP.SA,'var(--warm)',1.8)}${line(POP.PAK,'var(--accent)',2.6)}
   <circle cx="${x(27)}" cy="${y(POP.PAK[27])}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>
   ${[0,7,14,21,27].map(i=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${1990+i}</text>`).join('')}</svg>`;
}

function rSurveys(){ const sv=S.survey; sv.sus=sv.sus||{}; sv.tlx=sv.tlx||{}; sv.trust=sv.trust||{}; sv.kind=sv.kind||'sus';
  const kinds=[['sus','SUS'],['tlx','NASA-TLX'],['trust','Trust in Automation']];
  let body='';
  if(sv.kind==='sus') body=SUS_Q.map((q,i)=>likert('sus',i,q,5,'Strongly disagree','Strongly agree')).join('');
  else if(sv.kind==='tlx') body=TLX_Q.map(([k,l,q])=>`<div class="likert"><div><b style="font-weight:500">${l}</b><div class="small muted">${q}</div><input type="range" min="0" max="100" step="5" data-tlx="${k}" value="${sv.tlx[k]??50}" aria-label="${l}"></div><b class="num" id="tlx_${k}" style="min-width:36px;text-align:end">${sv.tlx[k]??50}</b></div>`).join('');
  else body=TRUST_Q.map((q,i)=>likert('trust',i,q,7,'Not at all','Extremely')).join('');
  return `<div class="card stack">
    <div class="row" style="justify-content:space-between"><div class="seg" role="group">${kinds.map(([k,l])=>`<button aria-pressed="${sv.kind===k}" data-act="svKind" data-v="${k}">${l}</button>`).join('')}</div>
    <span class="small muted">Participant <b>${esc(S.settings.participant||'not set')}</b> · condition <b>${esc(S.settings.reminderStyle)}</b></span></div>
    <div>${body}</div>
    <div class="field"><label for="sv_note">Think-aloud notes / comments</label><textarea id="sv_note">${esc(sv.note||'')}</textarea></div>
    <div class="row"><button class="btn pri" data-act="submitSurvey">Save ${kinds.find(k=>k[0]===sv.kind)[1]} response</button><span class="small muted">${surveyPreview()}</span></div></div>`;
}
function likert(kind,i,q,n,lo,hi){ const v=S.survey[kind][i]; return `<div class="likert"><div><span class="small muted num">${i+1}.</span> ${esc(q)}</div><div><div class="opts">${[...Array(n)].map((_,j)=>`<button data-act="lk" data-k="${kind}" data-i="${i}" data-v="${j+1}" aria-pressed="${v===j+1}" aria-label="${j+1}">${j+1}</button>`).join('')}</div><div class="small muted row" style="justify-content:space-between;gap:4px"><span>${lo}</span><span>${hi}</span></div></div></div>`; }
function susScore(a){ let s=0; for(let i=0;i<10;i++){ const v=a[i]; if(!v) return null; s+= i%2===0 ? v-1 : 5-v; } return s*2.5; }
function tlxScore(a){ return TLX_Q.reduce((s,[k])=>s+(+(a[k]??50)),0)/6; }
function trustScore(a){ let s=0; for(let i=0;i<12;i++){ const v=a[i]; if(!v) return null; s+= i<5 ? 8-v : v; } return s/12; }
function surveyPreview(){ const sv=S.survey; if(sv.kind==='sus'){ const s=susScore(sv.sus); return s==null?`${Object.keys(sv.sus).length}/10 answered`:`SUS score ${s.toFixed(1)}`; } if(sv.kind==='tlx') return `Raw TLX ${tlxScore(sv.tlx).toFixed(1)}`; const t=trustScore(sv.trust); return t==null?`${Object.keys(sv.trust).length}/12 answered`:`Trust ${t.toFixed(2)} / 7 (items 1–5 reversed)`; }
function rRecall(){
  const R=S.recall; const items=S.facts.filter(f=>f.approved);
  if(items.length<3) return `<div class="empty">Add at least 3 memories (or load a persona) to run the recall test.</div>`;
  if(!R) return `<div class="card stack"><div class="label">Final recall test (day 14)</div><p style="margin:0">The volunteer sees each memory title and picks the matching detail from three choices. Scores are split by "reminded" and "not reminded" groups.</p><div class="row"><button class="btn pri" data-act="startRecall">Start test for ${esc(S.settings.participant||tr('participant','شریک'))}</button></div></div>`;
  if(R.i>=R.qs.length){ const sc=g=>{ const q=R.qs.filter(x=>x.group===g); return q.length? Math.round(q.filter(x=>x.ok).length/q.length*100)+'%':'–'; };
    return `<div class="card stack"><div class="label">Recall test complete</div><div class="kpis"><div class="kpi"><div class="label">Reminded items</div><div class="v">${sc('reminded')}</div></div><div class="kpi"><div class="label">Not-reminded items</div><div class="v">${sc('control')}</div></div></div><div class="row"><button class="btn" data-act="startRecall">Run again</button></div></div>`; }
  const q=R.qs[R.i];
  return `<div class="card stack" style="max-width:640px"><div class="row" style="justify-content:space-between"><span class="label">Question ${R.i+1} of ${R.qs.length}</span><span class="chip">${q.group==='control'?'Not reminded':'Reminded'} (hidden from volunteer)</span></div>
    <h2 style="font-size:20px">${esc(q.title)}</h2><div class="ur">${esc(q.titleUr||'')}</div><p class="muted" style="margin:0">Which of these goes with this memory?</p>
    <div class="stack">${q.opts.map((o,j)=>`<button class="btn" style="justify-content:flex-start;text-align:start;padding:12px" data-act="answer" data-j="${j}">${esc(o)}</button>`).join('')}</div></div>`;
}
function startRecall(){
  const items=S.facts.filter(f=>f.approved); const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
  const first=t=>t.split(/(?<=[.!?])\s/)[0];
  const qs=shuffle(items).map(f=>{ const others=shuffle(items.filter(o=>o.id!==f.id)).slice(0,2).map(o=>first(o.text)); const correct=first(f.text); const opts=shuffle([correct,...others]); return {id:f.id,title:f.title,titleUr:f.titleUr,group:f.studyGroup==='control'?'control':'reminded',opts,correct:opts.indexOf(correct),ok:null}; });
  S.recall={qs,i:0}; render();
}
function rResults(){
  const rows=S.study; const parts=[...new Set(rows.map(r=>r.participant).filter(Boolean))];
  const latest=(p,kind,cond)=>rows.find(r=>r.participant===p&&r.kind===kind&&r.condition===cond);
  const metric=[['sus','SUS (0–100, higher = more usable)'],['tlx','NASA-TLX raw (0–100, lower = less burden)'],['trust','Trust (1–7)']];
  const stats=metric.map(([k,l])=>{ const pairs=parts.map(p=>[latest(p,k,'gentle'),latest(p,k,'conventional')]).filter(([a,b])=>a&&b).map(([a,b])=>[a.score,b.score]);
    const all=c=>rows.filter(r=>r.kind===k&&r.condition===c).map(r=>r.score); const mean=a=>a.length?(a.reduce((s,v)=>s+v,0)/a.length):null;
    return {k,l,g:mean(all('gentle')),c:mean(all('conventional')),ng:all('gentle').length,nc:all('conventional').length,w:wilcoxon(pairs)}; });
  const recallEv=S.events.filter(e=>e.kind==='recall');
  return `<div class="card tablewrap"><div class="label" style="margin-bottom:8px">Gentle vs conventional (Wilcoxon signed-rank on paired participants)</div>
   <table><thead><tr><th>Measure</th><th>Gentle mean</th><th>Conventional mean</th><th>Pairs</th><th>W</th><th>z</th><th>p (approx.)</th></tr></thead><tbody>
   ${stats.map(s=>`<tr><td>${s.l}</td><td class="num">${s.g==null?'–':s.g.toFixed(1)} <span class="muted small">(n=${s.ng})</span></td><td class="num">${s.c==null?'–':s.c.toFixed(1)} <span class="muted small">(n=${s.nc})</span></td><td class="num">${s.w.n}</td><td class="num">${s.w.n?s.w.W:'–'}</td><td class="num">${s.w.n?s.w.z.toFixed(2):'–'}</td><td class="num">${s.w.n?s.w.p.toFixed(3):'–'}</td></tr>`).join('')}
   </tbody></table><p class="small muted">p uses the normal approximation. With fewer than about 10 pairs, check W against exact tables (or SPSS). Each participant's latest response per condition is used.</p></div>
   <div class="card tablewrap" style="margin-top:14px"><div class="label" style="margin-bottom:8px">All responses</div>
   ${rows.length?`<table><thead><tr><th>When</th><th>Participant</th><th>Condition</th><th>Instrument</th><th>Score</th><th>Notes</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="num small">${new Date(r.ts).toLocaleString(L()==='ur'?'ur-PK':'en-GB')}</td><td>${esc(r.participant)}</td><td>${esc(r.condition)}</td><td>${esc(r.kind.toUpperCase())}</td><td class="num">${(+r.score).toFixed(r.kind==='trust'?2:1)}</td><td class="small">${esc(r.note||'')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No questionnaire responses yet.</div>'}
   ${recallEv.length?`<div class="label" style="margin:14px 0 8px">Recall tests</div><table><thead><tr><th>When</th><th>Participant</th><th>Reminded correct</th><th>Not reminded correct</th></tr></thead><tbody>${recallEv.map(e=>`<tr><td class="num small">${new Date(e.ts).toLocaleString(L()==='ur'?'ur-PK':'en-GB')}</td><td>${esc(e.participant)}</td><td class="num">${e.remOk}/${e.remN}</td><td class="num">${e.conOk}/${e.conN}</td></tr>`).join('')}</tbody></table>`:''}
   <div class="row" style="margin-top:12px">${DOWNLOADS?`<button class="btn pri" data-act="dlCsv">Download CSV</button>`:''}<button class="btn" data-act="copyCsv">Copy CSV</button></div></div>`;
}
function wilcoxon(pairs){
  const d=pairs.map(([a,b])=>a-b).filter(x=>x!==0); const n=d.length; if(!n) return {n:0};
  const abs=d.map((v,i)=>({v,a:Math.abs(v),i})).sort((x,y)=>x.a-y.a); let i=0; while(i<n){ let j=i; while(j+1<n&&abs[j+1].a===abs[i].a) j++; const r=(i+j)/2+1; for(let k=i;k<=j;k++) abs[k].r=r; i=j+1; }
  const Wp=abs.filter(x=>x.v>0).reduce((s,x)=>s+x.r,0), Wm=abs.filter(x=>x.v<0).reduce((s,x)=>s+x.r,0);
  const mu=n*(n+1)/4, sd=Math.sqrt(n*(n+1)*(2*n+1)/24); const z=sd?(Wp-mu)/sd:0; const p=2*(1-phi(Math.abs(z)));
  return {n,W:Math.min(Wp,Wm),z,p};
}
function phi(x){ const t=1/(1+.2316419*x), d=.3989423*Math.exp(-x*x/2); return 1-d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); }
function csv(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const lines=[['type','timestamp','participant','condition','instrument_or_kind','score','detail'].join(',')];
  S.study.forEach(r=>lines.push(['questionnaire',new Date(r.ts).toISOString(),r.participant,r.condition,r.kind,r.score,JSON.stringify(r.answers||{})].map(q).join(',')));
  S.events.filter(e=>!e.example).forEach(e=>lines.push(['event',new Date(e.ts).toISOString(),e.participant,e.style||'',e.kind,e.respSec??'',[e.rtype,e.mood,e.rule,e.flag,e.remOk!=null?`rem ${e.remOk}/${e.remN} con ${e.conOk}/${e.conN}`:''].filter(Boolean).join(' ')].map(q).join(',')));
  return lines.join('\n');
}

function pressKey(k){
  const L0=S.login; if(!L0) return;
  if(k==='del'){ L0.pin=L0.pin.slice(0,-1); L0.err=''; drawLogin(); return; }
  if(L0.pin.length>=4) return;
  L0.pin+=String(k);
  if(L0.pin.length<4){ drawLogin(); return; }
  const want=(S.settings.pins||DEFAULT_SETTINGS.pins)[L0.role];
  if(L0.pin===want){

/* ============ PROGRESS ============ */
function progressData(){
  const t=now(), tm=t.getHours()*60+t.getMinutes(); const days=[...Array(7)].map((_,i)=>dayKey(t.getTime()-(6-i)*864e5));
  const en=S.reminders.filter(r=>r.enabled);
  const perDay=days.map((d,i)=>{ const planned= i===6 ? en.filter(r=>toMin(r.time)<=tm).length : en.length;
    const done=new Set(S.events.filter(e=>e.day===d&&e.kind==='reminder_done').map(e=>e.reminderId)).size;
    let lbl; try{ lbl=new Date(t.getTime()-(6-i)*864e5).toLocaleDateString(L()==='ur'?'ur-PK':'en-GB',{weekday:'short'}); }catch(_){ lbl=d.slice(5); }
    return {d,lbl,planned,done:Math.min(done,Math.max(planned,done))}; });
  const plannedW=perDay.reduce((s,x)=>s+x.planned,0), doneW=perDay.reduce((s,x)=>s+Math.min(x.done,x.planned||x.done),0);
  const pct = plannedW? Math.round(Math.min(1,doneW/plannedW)*100) : 0;
  const moodDays=new Set(S.events.filter(e=>e.kind==='mood').map(e=>dayKey(e.ts)));
  let streak=0; for(let i=0;i<60;i++){ const k=dayKey(t.getTime()-i*864e5); if(moodDays.has(k)) streak++; else if(i>0) break; }
  const wk=t.getTime()-7*864e5;
  const explored=new Set(); S.events.filter(e=>e.ts>wk).forEach(e=>{ if(e.kind==='memory_view'&&e.factId) explored.add(e.factId); if(e.kind==='chat'&&Array.isArray(e.used)) e.used.forEach(id=>explored.add(id)); if(e.factId&&e.kind==='reminder_done') explored.add(e.factId); });
  const talks=S.events.filter(e=>e.kind==='chat'&&e.ts>wk).length;
  const allTalks=S.events.filter(e=>e.kind==='chat').length;
  const todayDone=perDay[6].planned>0 && perDay[6].done>=perDay[6].planned;
  const viewCount={}; S.events.forEach(e=>{ if(e.kind==='memory_view'&&e.factId) viewCount[e.factId]=(viewCount[e.factId]||0)+1; if(e.kind==='chat'&&Array.isArray(e.used)) e.used.forEach(id=>viewCount[id]=(viewCount[id]||0)+1); });
  const badges=[
    {k:'first',icon:'chat',c:'var(--pink)',en:'First talk',ur:'پہلی بات',on:allTalks>=1},
    {k:'mood3',icon:'sun',c:'var(--sun)',en:'3 days of check-ins',ur:'تین دن کا حال',on:streak>=3},
    {k:'mem5',icon:'book',c:'var(--orange)',en:'5 memories visited',ur:'پانچ یادیں',on:explored.size>=5},
    {k:'today',icon:'check',c:'var(--teal)',en:'All done today',ur:'آج سب مکمل',on:todayDone},
    {k:'story1',icon:'edit',c:'var(--violet)',en:'First story written',ur:'پہلی کہانی لکھی',on:S.facts.some(isMine)},
    {k:'week',icon:'trophy',c:'var(--sky)',en:'7-day check-ins',ur:'سات دن کا حال',on:streak>=7}];
  return {perDay,pct,doneW,plannedW,streak,explored:explored.size,talks,badges,viewCount};
}
function ring(pct,size=116){ const r=46,c=2*Math.PI*r; return `<svg viewBox="0 0 116 116" role="img" aria-label="${pct}%"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#50BDA9"/><stop offset="1" stop-color="#15473F"/></linearGradient></defs><circle cx="58" cy="58" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="12"/><circle cx="58" cy="58" r="${r}" fill="none" stroke="url(#rg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(c*pct/100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 58 58)"/><text x="58" y="66" text-anchor="middle" class="pct">${pct}%</text></svg>`; }
const BARC=['var(--violet)','var(--pink)','var(--orange)','var(--sun)','var(--teal)','var(--sky)','var(--violet)'];
function weekBars(pd){ const mx=Math.max(1,...pd.perDay.map(x=>x.planned)); return `<div class="bars">${pd.perDay.map((x,i)=>`<div><span class="num" style="color:var(--ink);font-weight:500">${x.done}</span><i style="height:${Math.max(6,Math.round(x.done/mx*92))}px;background:${x.done?BARC[i]:'var(--surface-2)'}" title="${x.d}: ${x.done} of ${x.planned}"></i><span>${esc(x.lbl)}</span></div>`).join('')}</div>`; }

document.addEventListener('click', async e=>{
  const t=e.target.closest('button,[data-act],[data-role]'); if(!t) return;

  if(d.role){ if(S.session && S.session.role==='research'){ S.role=d.role; lsSet('role',d.role); render(); window.scrollTo(0,0); } else loginModal(d.role); return; }
  if(d.login){ loginModal(d.login); return; }
  if(d.setlang){ S.uiLang=d.setlang; lsSet('uilang',d.setlang); closeModal(); render(); return; }
  if(d.key!=null){ pressKey(d.key); return; }
  if(d.ptab){ S.ptab=d.ptab; S.storyOpen=null; render(); return; }
  if(d.ftab){ S.ftab=d.ftab; render(); return; }
  if(d.rtab){ S.rtab=d.rtab; render(); return; }
  if(d.cat){ S.storyCat=d.cat; render(); return; }
  if(d.mood){ const m=d.mood; await logEvent({kind:'mood',mood:m});
    const lows=S.events.filter(x=>x.kind==='mood'&&(x.mood==='worried'||x.mood==='sad')&&now().getTime()-x.ts<864e5).length + ((m==='worried'||m==='sad')?1:0);
    if((m==='worried'||m==='sad') && lows>=2) addDoc('alerts',{level:'watch',reason:'Two or more worried/sad check-ins in 24 hours',excerpt:'',ts:now().getTime(),resolved:false}).catch(()=>{});
    if(S.mode==='local') render(); return; }
  const id=d.id, f=id?S.facts.find(x=>x.id===id):null;
  switch(d.act){
    case 'logout': S.session=null; lsSet('session','null'); S.active=null; S.chat=[]; render(); window.scrollTo(0,0); toast('Signed out.'); break;
    case 'toSignin': document.getElementById('signin')?.scrollIntoView({behavior:'smooth'}); break;

    case 'closeStory': S.storyOpen=null; render(); break;

    case 'editStory': if(f){ S.storyNew={id:f.id,kind:f.kind||'remembered',shared:!!f.shared,draft:{title:f.title,text:f.text,shared:!!f.shared},audioUrl:f.audioId?imgSrc(f.audioId):''}; S.storyOpen=null; render(); } break;

      render(); break; }
    case 'dlCsv': try{ await DOWNLOADS.save({filename:`yaadein-study-${dayKey(Date.now())}.csv`,data:csv()}); }catch(err){ if(err&&err.code!=='cancelled'&&err.code!=='declined') toast('Download did not start. Use Copy CSV instead.'); } break;
    case 'copyCsv': try{ await navigator.clipboard.writeText(csv()); toast('CSV copied. Paste it into Excel or SPSS.'); }catch(err){ openModal(`<h2>Copy the CSV</h2><textarea style="min-height:240px" readonly>${esc(csv())}</textarea><div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeModal">Close</button></div>`); setTimeout(()=>document.querySelector('.modal textarea')?.select(),50); } break;
  }
});
document.addEventListener('change', async e=>{
  const t=e.target; if(t.id==='st_shared'){ saveDraft(); if(S.storyNew) S.storyNew.sharedTouched=true; }
  if(t.id==='st_photo' && S.storyNew){ S.storyNew.photoFile=t.files[0]||null; const n=document.getElementById('st_photo_name'); if(n) n.textContent=S.storyNew.photoFile?S.storyNew.photoFile.name:''; }
  if(t.dataset.act==='toggleRem') await updDoc('reminders',t.dataset.id,{enabled:t.checked});
});
function saveDraft(){ if(!S.storyNew) return; const t=document.getElementById('st_title'), x=document.getElementById('st_text'), sh=document.getElementById('st_shared'); if(t) S.storyNew.draft.title=t.value; if(x) S.storyNew.draft.text=x.value; if(sh) S.storyNew.draft.shared=sh.checked; }
const REC2={on:false,start:0,timer:null,media:null,stream:null,chunks:[],interim:'',sr:null};
function voiceCard(){
  const e=S.storyNew, on=REC2.on;
  const t=on?Math.floor((Date.now()-REC2.start)/1000):0;
  return `<div class="voicecard ${on?'on':''}">
    <button type="button" class="bigmic" data-act="${on?'stopVoice':'startVoice'}" aria-label="${on?tr('Stop recording','ریکارڈنگ روکیں'):tr('Tell my story by speaking','بول کر کہانی سنائیں')}">${on?'<span class="sq"></span>':ic('mic',40)}</button>
    <div class="vc-txt">
      <b class="${urc()}">${on?tr('Listening… tell your story','سن رہا ہوں… اپنی کہانی سنائیں'):(e.audioUrl?tr('Your voice is recorded','آپ کی آواز ریکارڈ ہو گئی'):tr('Tell it by speaking','بول کر سنائیں'))}</b>
      <span class="small muted ${urc()}">${on?`<span id="rec_time" class="num" style="direction:ltr;unicode-bidi:isolate">${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}</span> · ${tr('Tap the square to stop','روکنے کے لیے چوکور دبائیں')}`:tr('Tap the mic and just talk. Your words appear below and your voice is saved with the story.','مائیک دبائیں اور بولیں۔ آپ کے الفاظ نیچے لکھے جائیں گے اور آواز کہانی کے ساتھ محفوظ ہوگی۔')}</span>
    </div>
    ${on?`<div class="live ${urc()}" id="rec_live" dir="auto">${esc(REC2.interim||'…')}</div>`:''}
    ${!on&&e.audioUrl?`<div class="vc-play"><audio controls src="${esc(e.audioUrl)}"></audio><button type="button" class="btn sm ghost danger" data-act="dropVoice">${ic('trash',15)} <span class="${urc()}">${tr('Remove recording','ریکارڈنگ ہٹائیں')}</span></button></div>`:''}
  </div>`;
}
function micBlocked(){
  openModal(`<h2 class="${urc()}">${tr('The microphone is not available here','یہاں مائیک دستیاب نہیں')}</h2>
   <p class="${urc()}" style="margin:0">${tr('Inside the Claude link, pages are not allowed to use the microphone. Voice works when the app is opened directly in a browser:','Claude کے لنک کے اندر صفحات کو مائیک استعمال کرنے کی اجازت نہیں۔ ایپ کو براہِ راست براؤزر میں کھولیں تو آواز کام کرتی ہے:')}</p>
   <div class="stack small ${urc()}">
     <div class="card">${tr('Open the Yaadein-App.html file (or your Netlify link) in <b>Chrome</b> or <b>Edge</b>.','Yaadein-App.html فائل (یا اپنا Netlify لنک) <b>Chrome</b> یا <b>Edge</b> میں کھولیں۔')}</div>
     <div class="card">${tr('Tap the mic. When the browser asks, choose <b>Allow</b>.','مائیک دبائیں۔ جب براؤزر پوچھے تو <b>Allow</b> دبائیں۔')}</div>
     <div class="card">${tr('Stay connected to the internet so your words can be written.','انٹرنیٹ آن رکھیں تاکہ آپ کے الفاظ لکھے جا سکیں۔')}</div>
   </div>
   <p class="small muted ${urc()}" style="margin:0">${tr('For now you can type your story.','ابھی آپ اپنی کہانی لکھ سکتے ہیں۔')}</p>
   <div class="row" style="justify-content:flex-end"><button class="btn pri" data-act="closeModal">${tr('OK','ٹھیک ہے')}</button></div>`);
}
async function startVoice(){
  saveDraft(); const st=S.storyNew; if(!st||REC2.on) return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  let haveRec=false, haveSR=false;
  if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true}); REC2.stream=stream; REC2.chunks=[];
      const mr=new MediaRecorder(stream); REC2.media=mr;
      mr.ondataavailable=ev=>{ if(ev.data && ev.data.size) REC2.chunks.push(ev.data); };
      mr.onstop=()=>{ try{ REC2.stream.getTracks().forEach(t=>t.stop()); }catch(_){}
        if(REC2.chunks.length && S.storyNew){ const blob=new Blob(REC2.chunks,{type:mr.mimeType||'audio/webm'}); if(S.storyNew.audioUrl&&S.storyNew.audioUrl.startsWith('blob:')) URL.revokeObjectURL(S.storyNew.audioUrl); S.storyNew.audioBlob=blob; S.storyNew.audioUrl=URL.createObjectURL(blob); render(); } };
      mr.start(1000); haveRec=true;
    }catch(err){ /* blocked or no mic */ }
  }
  if(SR && (haveRec || !window.MediaRecorder || !(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))){
    try{
      const r=new SR(); REC2.sr=r; r.lang=L()==='ur'?'ur-PK':'en-GB'; r.continuous=true; r.interimResults=true;
      r.onresult=ev=>{ let fin='', mid=''; for(let i=ev.resultIndex;i<ev.results.length;i++){ const tx=ev.results[i][0].transcript; if(ev.results[i].isFinal) fin+=tx+' '; else mid+=tx; }
        if(fin && S.storyNew){ S.storyNew.draft.text=((S.storyNew.draft.text||'').trim()+' '+fin.trim()).trim(); const x=document.getElementById('st_text'); if(x) x.value=S.storyNew.draft.text; }
        REC2.interim=mid; const lv=document.getElementById('rec_live'); if(lv) lv.textContent=mid||'…'; };
      r.onerror=ev=>{ if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){ REC2.sr=null; if(!haveRec){ stopVoice(true); micBlocked(); } } };
      r.onend=()=>{ if(REC2.on && REC2.sr===r){ try{ r.start(); }catch(_){} } };
      r.start(); haveSR=true;
    }catch(err){}
  }
  if(!haveRec && !haveSR){ micBlocked(); return; }
  REC2.on=true; REC2.start=Date.now(); REC2.interim='';
  clearInterval(REC2.timer); REC2.timer=setInterval(()=>{ const el=document.getElementById('rec_time'); if(!el) return; const t=Math.floor((Date.now()-REC2.start)/1000); el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); if(t>=600) stopVoice(); },500);
  if(!haveSR) toast(tr('Recording your voice. Automatic writing is not available in this browser, so you can type the words later.','آپ کی آواز ریکارڈ ہو رہی ہے۔ اس براؤزر میں خودکار لکھائی دستیاب نہیں، الفاظ بعد میں لکھ سکتے ہیں۔'));
  render();
}
function stopVoice(silent){
  REC2.on=false; clearInterval(REC2.timer);
  const r=REC2.sr; REC2.sr=null; try{ r&&r.stop(); }catch(_){}
  try{ if(REC2.media && REC2.media.state!=='inactive') REC2.media.stop(); else if(REC2.stream) REC2.stream.getTracks().forEach(t=>t.stop()); }catch(_){}
  REC2.media=null;
  const st=S.storyNew;
  if(st){ if(REC2.interim){ st.draft.text=((st.draft.text||'').trim()+' '+REC2.interim.trim()).trim(); } REC2.interim='';
    if(!(st.draft.title||'').trim() && (st.draft.text||'').trim()){ const w=st.draft.text.trim().split(/\s+/).slice(0,5).join(' '); st.draft.title=w+(st.draft.text.trim().split(/\s+/).length>5?'…':''); } }
  if(!silent) render();
}
async function storeAudio(blob){
  if(ASSETS){ const typ=/mp4/.test(blob.type)?'video/mp4':/ogg/.test(blob.type)?'video/ogg':'video/webm';
    try{ const r=await ASSETS.upload(blob,{type:typ}); return r.id; }catch(e){ toast(tr('Your words are saved, but the voice recording could not be stored.','آپ کے الفاظ محفوظ ہو گئے، مگر آواز کی ریکارڈنگ محفوظ نہیں ہو سکی۔')); return ''; } }
  return URL.createObjectURL(blob);
}
document.addEventListener('input', e=>{ if(e.target.closest && e.target.closest('#storyForm')) saveDraft(); const k=e.target.dataset.tlx; if(k){ S.survey.tlx[k]=+e.target.value; const o=document.getElementById('tlx_'+k); if(o) o.textContent=e.target.value; } if(e.target.id==='sv_note') S.survey.note=e.target.value; });
document.addEventListener('submit', async e=>{
  e.preventDefault(); const fm=e.target;
  if(fm.id==='composer'){ const inp=document.getElementById('askInput'); const v=inp.value; inp.value=''; ask(v); return; }
  if(fm.id==='settingsForm'){ const fd=new FormData(fm); const p={}; const pins={...(S.settings.pins||DEFAULT_SETTINGS.pins)};
    for(const [k,v] of fd){ if(k.startsWith('pin_')){ const val=String(v).trim(); if(!/^\d{4}$/.test(val)){ toast(`${ROLES[k.slice(4)].en} PIN must be 4 digits.`); return; } pins[k.slice(4)]=val; } else p[k]= k==='maxMemoryPerDay'?Math.max(0,Math.min(10,+v||0)):String(v).trim(); }
    p.pins=pins; await saveSettings(p); toast('Settings saved.'); return; }
  if(fm.id==='storyForm'){
    if(REC2.on){ stopVoice(true); await wait(400); }
    saveDraft(); const st=S.storyNew; if(!(st.draft.title||'').trim() && (st.draft.text||'').trim()) stopVoice(true);
    const title=(st.draft.title||'').trim() || (st.audioBlob?tr('My voice story','میری آواز میں کہانی'):''), text=(st.draft.text||'').trim() || (st.audioBlob?tr('(Told by voice. Press play to listen.)','(آواز میں سنائی گئی۔ سننے کے لیے چلائیں۔)'):'');
    if(!title||!text){ toast(tr('Please add a name and your story.','براہِ کرم نام اور کہانی لکھیں۔')); return; }
    const btn=fm.querySelector('button[type=submit]'); btn.disabled=true;
    const data={category:'mine',source:'patient',kind:st.kind,shared:!!st.draft.shared,title,titleUr:title,text,textUr:text,people:[],tags:''};
    try{
      const ph=st.photoFile||document.getElementById('st_photo')?.files[0]; if(ph) data.photoId=await storeFile(ph,'photo');
      if(st.audioBlob){ const aid=await storeAudio(st.audioBlob); if(aid) data.audioId=aid; } else if(st.dropAudio){ data.audioId=''; }
      if(st.id){ const old=S.facts.find(x=>x.id===st.id)||{}; const changedText = old.text!==text || old.title!==title || old.kind!==st.kind; await updDoc('facts',st.id,{...data, approved: changedText?false:!!old.approved && st.kind!=='imagined' && data.shared}); }
      else { await addDoc('facts',{...data,approved:false,studyGroup:'none',photoId:data.photoId||'',audioId:data.audioId||'',createdAt:Date.now()}); logEvent({kind:'story_added',storyKind:st.kind,shared:data.shared}); }
      S.storyNew=null; S.storyCat='mine'; S.storyOpen=null; render();
      toast(data.shared?tr('Your story is saved and shared with your family.','آپ کی کہانی محفوظ ہو گئی اور گھر والوں کے ساتھ شیئر ہو گئی۔'):tr('Your story is saved. Only you can see it.','آپ کی کہانی محفوظ ہو گئی۔ صرف آپ اسے دیکھ سکتے ہیں۔'));
    }catch(err){ btn.disabled=false; }
    return;
  }
  if(fm.id==='remForm'){ const fd=new FormData(fm); const data={type:fd.get('type'),time:fd.get('time'),label:fd.get('label').trim(),labelUr:fd.get('labelUr').trim()}; const id=fm.dataset.id;
    if(id) await updDoc('reminders',id,data); else await addDoc('reminders',{...data,enabled:true}); closeModal(); toast('Reminder saved.'); return; }
  if(fm.id==='factForm'){
    const btn=fm.querySelector('button[type=submit]'); btn.disabled=true; btn.textContent='Saving…';
    const fd=new FormData(fm); const id=fm.dataset.id; const old=id?S.facts.find(x=>x.id===id):{};
    const data={category:fd.get('category'),title:fd.get('title').trim(),titleUr:fd.get('titleUr').trim(),text:fd.get('text').trim(),textUr:fd.get('textUr').trim(),tags:fd.get('tags').trim(),people:fd.get('people').split(',').map(s=>s.trim()).filter(Boolean),approved:!!fd.get('approved')};
    try{
      const ph=document.getElementById('m_photo').files[0], au=document.getElementById('m_audio').files[0];
      if(ph) data.photoId = await storeFile(ph,'photo');
      if(au) data.audioId = await storeFile(au,'voice note');
      if(id) await updDoc('facts',id,data); else await addDoc('facts',{...data,photoId:data.photoId||'',audioId:data.audioId||'',studyGroup:Math.random()<.5?'reminded':'control',createdAt:Date.now()});
      closeModal(); toast(data.approved?'Memory saved. Yaad can use it now.':'Memory saved. Approve it so Yaad can use it.');
    }catch(err){ btn.disabled=false; btn.textContent='Try again'; }
  }
});
async function storeFile(file,what){
  if(ASSETS){ try{ const r=await ASSETS.upload(file); return r.id; }catch(e){
    const msg={too_large:`That ${what} is too big (20 MB limit).`,unsupported_type:`That ${what} format can't be stored. Try a JPG or PNG photo, or an MP4/WebM recording.`,not_uploader:`Only editors of this app can add a ${what}.`}[e.code]||`Could not upload the ${what} (${e.code}).`;
    toast(msg); throw e; } }
  return URL.createObjectURL(file); // demo mode: lives until reload
}
async function loadPersona(p){
  try{
    for(const f of [...S.facts]) await delDoc('facts',f.id);
    for(const r of [...S.reminders]) await delDoc('reminders',r.id);
    for(let i=0;i<p.facts.length;i++){ const {id,...rest}=personaFact(p.facts[i],i); await addDoc('facts',rest); }
    for(const r of p.reminders){ const {id,...rest}=personaRem(r); await addDoc('reminders',rest); }
    await saveSettings({...p.settings,persona:p.key});
    toast(`${p.label} loaded.`);
  }catch(e){}
}
boot();
</script>
